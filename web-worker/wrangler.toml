# The web app Worker. Deploying is `wrangler deploy` from this folder; README.md has the
# provisioning commands. FRONTIER_CLIENT_ID is a Worker secret, set with `wrangler secret put`.

name = "d47-web"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = false

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "d47-web"
database_id = "cb36697e-b5d0-4697-bffe-7a271f510f71"
