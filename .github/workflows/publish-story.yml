name: publish-story
run-name: publish-story ${{ inputs.story }} ${{ inputs.token }}

# Uploads one stock story's built files to the stories-1 release and merges its card into
# index.json, for sessions that cannot upload release assets themselves. Started by
# tools/publish-story.py --via-actions:
#
#   python tools/publish-story.py <folder> --via-actions --branch <branch>
#
# The script checks and builds the story, commits the files and card.json to story-upload/<story>/
# on <branch>, dispatches this workflow with that commit and a token that appears in the run name,
# and waits for the run. Runs queue in one concurrency group and run one at a time, so each reads
# index.json, adds or replaces its card by id, numbers it and uploads it before the next one reads.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch holding story-upload/<story>/"
        required: true
        type: string
      commit:
        description: "Commit on that branch with the staged files"
        required: true
        type: string
      story:
        description: "Story id"
        required: true
        type: string
      token:
        description: "32 hex digits that identify this run to the script"
        required: true
        type: string
      replace:
        description: "Replace a story already in the release"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-story
  queue: max

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check the inputs
        env:
          STORY: ${{ inputs.story }}
          COMMIT: ${{ inputs.commit }}
          TOKEN: ${{ inputs.token }}
        run: |
          if ! [[ "$STORY" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Story id must be lower-case words joined by hyphens. Got '$STORY'." >&2
            exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Commit must be a full 40-digit SHA. Got '$COMMIT'." >&2
            exit 1
          fi
          if ! [[ "$TOKEN" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Token must be 32 hex digits. Got '$TOKEN'." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Upload to stories-1 and merge the card into index.json
        env:
          GH_TOKEN: ${{ github.token }}
          STORY: ${{ inputs.story }}
          REPLACE: ${{ inputs.replace }}
        shell: python3 {0}
        run: |
          import hashlib, json, os, pathlib, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          story = os.environ["STORY"]
          replace = os.environ["REPLACE"] == "true"
          staged = pathlib.Path("story-upload") / story
          release = "stories-1"

          def gh(*args):
              done = subprocess.run(["gh", *args, "--repo", repo], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"gh {' '.join(args[:2])} failed: {done.stderr.strip()}")
              return done.stdout

          card_file = staged / "card.json"
          if not (staged / f"{story}.sealed").is_file() or not card_file.is_file():
              sys.exit(f"{staged} needs {story}.sealed and card.json.")
          card = json.loads(card_file.read_text(encoding="utf-8"))
          if card.get("id") != story:
              sys.exit(f"card.json has the id {card.get('id')}, not {story}.")
          card["sealedSha256"] = hashlib.sha256((staged / f"{story}.sealed").read_bytes()).hexdigest()

          names = {asset["name"] for asset in json.loads(gh("release", "view", release, "--json", "assets"))["assets"]}
          if "index.json" in names:
              gh("release", "download", release, "--pattern", "index.json", "--dir", "merge", "--clobber")
              index = json.loads(pathlib.Path("merge/index.json").read_text(encoding="utf-8"))
          elif any(name.endswith(".sealed") and name != f"{story}.sealed" for name in names):
              sys.exit(f"{release} holds stories but no index.json; refusing to start a new index.")
          else:
              index = []

          at = next((i for i, existing in enumerate(index) if existing.get("id") == story), None)
          if at is not None and not replace:
              sys.exit(f"{story} is already in {release}; dispatch with replace to publish it again.")

          for file in sorted(staged.iterdir()):
              if file.name not in ("card.json", "index.json"):
                  gh("release", "upload", release, str(file), "--clobber")

          if at is not None:
              card["number"] = index[at]["number"]
              index[at] = card
          else:
              card["number"] = max((c.get("number", 0) for c in index), default=0) + 1
              index.append(card)
          merged = pathlib.Path("merge/index.json")
          merged.parent.mkdir(exist_ok=True)
          merged.write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          gh("release", "upload", release, str(merged), "--clobber")
          print(f"Published {story} as number {card['number']} to {release}.")

      - name: Remove the staged files from the branch
        continue-on-error: true
        env:
          BRANCH: ${{ inputs.branch }}
          STORY: ${{ inputs.story }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "refs/heads/$BRANCH"
            git checkout --quiet --detach FETCH_HEAD
            [ -e "story-upload/$STORY" ] || exit 0
            git rm -r --quiet "story-upload/$STORY"
            git commit --quiet -m "Remove story-upload/$STORY after publishing"
            git push --quiet origin "HEAD:refs/heads/$BRANCH" && exit 0
            sleep 5
          done
          exit 1
