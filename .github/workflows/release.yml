name: release

# Nothing here triggers on push — a commit to any branch, main included,
# fires no run at all. A release happens when you ask for one:
#
#   tools\release.ps1 -Patch
#
# Order is deliberate: the suite runs before the tag exists, so a failure leaves nothing
# published and nothing to clean up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z — no leading v, no label"
        required: true
        type: string
      docs_only:
        description: "Deploy docs and cut no release (emergency doc fix)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.docs_only }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The compiler runs on the newest runtime beside it and writes that runtime into every assembly,
      # so the SDK goes into a folder of its own. tools\verify-release.ps1 builds from the same kind of folder.
      - name: Install the .NET SDK
        shell: pwsh
        run: |
          $dotnet = ./tools/install-dotnet.ps1 -Parent $env:RUNNER_TEMP
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dotnet
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOTNET_ROOT=$dotnet"

      # ReleaseVersion.TryParse takes exactly three integer parts and treats anything after a
      # '-' as a label, which marks the build as a local working-tree build. Refuse early.
      - name: Check the version is releasable
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be X.Y.Z with no leading v and no label. Got '$v'."
          }
          if (git tag --list "v$v") {
            throw "Tag v$v already exists. A published tag never moves; pick another version."
          }

      # The checkout path is written into the shipped binaries, so Build, Test and Publish run from
      # the fixed root B:\ and a rebuild from any clone gives the same d47.exe.
      - name: Map the build root
        shell: pwsh
        run: |
          subst B: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "subst failed with $LASTEXITCODE" }

      # Built once, with the version being released, so the suite runs against the binaries that
      # ship and Publish below has nothing left to compile.
      - name: Build
        shell: pwsh
        working-directory: B:\
        run: |
          if (-not (Test-Path 'B:\d47.slnx')) { throw 'B:\d47.slnx is missing; the subst mapping did not carry over.' }
          dotnet build d47.slnx -c Release -p:Version=${{ inputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "Build failed with $LASTEXITCODE" }

      # The gate. Everything below this line only runs on a green suite.
      #
      # Seven of the eight projects. D47.App.Tests runs on the maintainer's machine instead, before
      # this workflow is dispatched at all — see tools\release.ps1. Its 1365 Avalonia headless
      # tests cost 2m52s on a four-vCPU runner against 76s locally, and they are the only ones
      # that do; the seven here total about a minute and carry Core's 5490.
      #
      # Sequential on purpose. Running them concurrently was measured and lost: D47.App.Tests
      # went 2m34s -> 3m21s and Core.Tests 20s -> 39s for no change in the total, because
      # Avalonia.Headless.XUnit puts every test on one dispatcher thread and starves against
      # anything sharing the machine.
      - name: Test
        shell: pwsh
        working-directory: B:\
        run: |
          if (-not (Test-Path 'B:\d47.slnx')) { throw 'B:\d47.slnx is missing; the subst mapping did not carry over.' }
          $projects = Get-ChildItem tests -Filter *.csproj -Recurse -Depth 1 |
              Where-Object BaseName -ne 'D47.App.Tests'
          foreach ($project in $projects) {
              dotnet test $project.FullName -c Release --no-build --nologo
              if ($LASTEXITCODE -ne 0) { throw "$($project.BaseName) failed." }
          }

      # No -o: PublishDir is already bin\$(Configuration)\publish\, which is exactly where
      # installer\d47.iss reads from. Passing one breaks the installer's paths.
      - name: Publish
        shell: pwsh
        working-directory: B:\
        run: |
          if (-not (Test-Path 'B:\d47.slnx')) { throw 'B:\d47.slnx is missing; the subst mapping did not carry over.' }
          dotnet publish src/D47.App/D47.App.csproj -c Release -p:Version=${{ inputs.version }} --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Publish failed with $LASTEXITCODE" }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /DVersion=${{ inputs.version }} installer\d47.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      # d47.zip is what the in-app updater applies, and UpdateInstaller.StaleRuntimeFiles retires
      # anything under runtimes\, ships\, portraits\, engineers\ or voices\ that the archive does not carry. An incomplete archive
      # deletes files from Commanders' machines, so the payload is exactly the installer's seven
      # entries and it is flat at the zip root — UpdateInstaller requires d47.exe there.
      - name: Pack d47.zip
        shell: pwsh
        run: |
          $publish = 'src/D47.App/bin/Release/publish'
          foreach ($entry in 'd47.exe', 'runtimes', 'ships', 'portraits', 'engineers', 'codex-placeholders', 'voices') {
            if (-not (Test-Path "$publish/$entry")) { throw "Publish is missing $entry" }
          }
          if (-not (Test-Path "$publish/runtimes/vulkan/win-x64/ggml-vulkan-whisper.dll")) {
            throw "Publish is missing the Vulkan whisper runtime; --selftest would exit 8"
          }
          Compress-Archive -Force -DestinationPath d47.zip -Path `
            "$publish/d47.exe", "$publish/runtimes", "$publish/ships", "$publish/portraits", "$publish/engineers", "$publish/codex-placeholders", "$publish/voices"

      # sha256sum format: the hash, two spaces, the name. UpdateInstaller.ParseChecksum takes the
      # first space-delimited field of the first line and wants 64 hex characters — a tab
      # separator does not parse.
      - name: Checksum the assets
        shell: pwsh
        run: |
          $setup = "installer/d47-setup-${{ inputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found at $setup" }
          foreach ($file in 'd47.zip', $setup) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $file -Leaf
            Set-Content -Path "$file.sha256" -Value "$hash  $name" -Encoding ascii
          }

      - name: Scan the artifacts with Defender
        shell: pwsh
        run: |
          & tools/scan-release.ps1 src/D47.App/bin/Release/publish d47.zip "installer/d47-setup-${{ inputs.version }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "Defender scan failed with exit $LASTEXITCODE" }

      - name: Attest the artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            d47.zip
            installer/d47-setup-${{ inputs.version }}.exe

      # gh creates the tag as part of this, so the tag comes into existence only once the suite
      # is green and every asset is built. Non-draft and non-prerelease: releases/latest is what
      # the in-app updater follows, and a draft or prerelease is invisible to it.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" `
            --target "${{ github.sha }}" `
            --title "v${{ inputs.version }}" `
            --generate-notes `
            d47.zip `
            d47.zip.sha256 `
            "installer/d47-setup-${{ inputs.version }}.exe" `
            "installer/d47-setup-${{ inputs.version }}.exe.sha256"

      # Reports only. Engine verdicts on an unsigned single-file app vary too much to gate on.
      - name: Report VirusTotal results
        continue-on-error: true
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          & tools/virustotal-report.ps1 d47.zip "installer/d47-setup-${{ inputs.version }}.exe"

  # Docs go out after the release is live, never before. Pages source must be set to "GitHub
  # Actions" rather than "deploy from a branch" — that is what stops a Pages run firing on
  # every push to main.
  docs:
    needs: release
    if: ${{ always() && (inputs.docs_only || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
