name: release

# Tag and push is the whole release process. Signed and annotated, and a published tag never
# moves — see CLAUDE.md:
#   git tag -s v0.1.0 -m "what changed" && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# No telemetry (CLAUDE.md), on the workflow that actually builds what ships.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG section for this version, so the notes a Commander
      # reads are the ones written by hand rather than a list of commit subjects — which in this
      # repository are deliberately evocative and make poor release notes.
      #
      # Run here, before the build, so a missing section is in the log within seconds rather
      # than after a full test-publish-selftest cycle.
      #
      # It falls back to generated notes rather than failing, and that is a judgement rather
      # than an oversight: this workflow only ever runs on a tag that has already been pushed,
      # and CLAUDE.md records that a failed run leaves a published tag with no Release behind
      # it, "which costs a version number to correct". Refusing to publish over a missing
      # heading would spend a version number on a documentation slip. The warning below is the
      # louder half of the trade — it surfaces on the workflow summary.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"

          # From the "## <version> " heading to the next "## ", heading excluded — the release
          # title already carries the version. Anchored with index()==1 so 0.1.0 cannot match
          # inside 0.1.0-rc or a version quoted mid-sentence.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          # Tested against a version that is not in the file: "-s" is the wrong check here,
          # because normalising an empty extraction still leaves a one-byte newline and the
          # fallback would never fire — publishing an empty body instead. Ask for a character
          # that is not whitespace.
          if grep -q '[^[:space:]]' notes.md; then
            # Trim the blank lines the section boundaries leave at both ends.
            sed -i -e '/./,$!d' notes.md
            printf '%s\n' "$(cat notes.md)" > notes.md
          else
            : > notes.md
          fi

          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for $version taken from CHANGELOG.md ($(wc -l < notes.md) lines)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No CHANGELOG entry::CHANGELOG.md has no '## $version' section, so this release falls back to generated notes. Add the section and the next release will use it."
          fi

      - run: dotnet test -c Release

      # Publish settings live in D47.App.csproj so this needs no flags.
      - run: dotnet publish src/D47.App -c Release -p:Version=${{ steps.v.outputs.version }}

      # The published build is the one thing dotnet test never touches — that gap once shipped
      # a transcriber that had never worked. The selftest loads a real speech model in the real
      # published exe and refuses the release if it cannot transcribe. Any ggml model proves
      # the natives load; tiny.en is the smallest, and the cache spares huggingface a 75 MB
      # download per release.
      #
      # Since Phase 13 it covers the second native too: webrtc-apm reaches a published build
      # through the single-file bundle rather than through the loose folder Whisper needs, and a
      # canceller that fails to start does not stop d47 — it quietly leaves hands-free listening
      # half-duplex, which is exactly the sort of failure that ships.
      - name: Speech model for the self-test
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: whisper-ggml-tiny.en

      - name: Fetch the speech model if not cached
        shell: pwsh
        run: |
          if (-not (Test-Path .model-cache/ggml-tiny.en.bin)) {
            New-Item -ItemType Directory -Force .model-cache | Out-Null
            Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -OutFile .model-cache/ggml-tiny.en.bin
          }

      - name: Self-test the published build
        timeout-minutes: 10
        shell: pwsh
        working-directory: src/D47.App/bin/Release/publish
        run: |
          New-Item -ItemType Directory -Force data\models | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.model-cache\ggml-tiny.en.bin') data\models\
          $p = Start-Process -FilePath .\d47.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if ($p.ExitCode -ne 0) {
            Get-Content data\logs\d47-*.log -ErrorAction SilentlyContinue | Select-Object -Last 80
            exit $p.ExitCode
          }

      # The exe and the native libraries beside it, and nothing else — never data\, which the
      # selftest just wrote. Whisper's loader probes runtimes\win-x64 on disk beside the exe,
      # which is why a release is an archive rather than a bare executable.
      - name: Package
        shell: pwsh
        working-directory: src/D47.App/bin/Release/publish
        run: Compress-Archive -Path d47.exe, runtimes -DestinationPath d47.zip

      # The installer is the normal way in; the zip stays for portable use and is what the
      # in-app updater fetches. Both come from the same publish output that just self-tested.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc /DVersion=${{ steps.v.outputs.version }} installer\d47.iss
          if ($LASTEXITCODE -ne 0) { throw "installer compile failed ($LASTEXITCODE)" }

      - name: Checksums
        shell: bash
        run: |
          cd src/D47.App/bin/Release/publish
          sha256sum d47.zip | tee d47.zip.sha256
          cd "$GITHUB_WORKSPACE/installer"
          sha256sum d47-setup.exe | tee d47-setup.exe.sha256

      # Unsigned with published checksums, per architecture.md §9.
      - uses: softprops/action-gh-release@v2
        with:
          name: d47 ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: |
            installer/d47-setup.exe
            installer/d47-setup.exe.sha256
            src/D47.App/bin/Release/publish/d47.zip
            src/D47.App/bin/Release/publish/d47.zip.sha256
