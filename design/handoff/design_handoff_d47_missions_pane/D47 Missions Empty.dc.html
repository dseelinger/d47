<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Missions, none accepted</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../system/tokens/palette.css">
<link rel="stylesheet" href="../../system/tokens/type.css">
<link rel="stylesheet" href="../../system/components/kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&amp;family=Sintony:wght@400;700&amp;family=JetBrains+Mono&amp;display=swap">
<style>
body{margin:0;background:#070606}
</style>
</helmet>
<div class="d47-root d47-window" data-d47-theme="{{theme}}" style="width: 100%; min-height: 560px;">
  <div class="d47-titlebar">
    <span class="d47-brand-mark" aria-hidden="true"></span>
    <span class="d47-brand-name">DIRECTIVE 47</span>
    <span class="d47-version">0.111.0</span>
    <div class="d47-window-controls">
      <button type="button" class="d47-window-control" aria-label="Minimise">—</button>
      <button type="button" class="d47-window-control" aria-label="Maximise">□</button>
      <button type="button" class="d47-window-control close" aria-label="Close">✕</button>
    </div>
  </div>
  <div class="d47-window__body" style="gap: 18px;">
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 104px; column-gap: 16px; align-items: end;">
      <div style="display: flex; flex-direction: column; min-width: 0;">
        <nav aria-label="Tabs" style="display: flex; flex-wrap: wrap; gap: 2px;">
          <button type="button" class="d47-tab">Transcript</button>
          <button type="button" class="d47-tab">Search</button>
          <button type="button" class="d47-tab">Stories</button>
          <button type="button" class="d47-tab active" aria-current="page">Commander</button>
          <button type="button" class="d47-tab">Asset Mgmt</button>
          <button type="button" class="d47-tab">Navigation</button>
          <button type="button" class="d47-tab">Settings</button>
          <button type="button" class="d47-tab" style="margin-left: auto; font-size: 14px; letter-spacing: 0.08em;">Help</button>
        </nav>
        <div style="height: 2px; background: var(--d47-a);"></div>
        <div style="height: 44px; margin-top: 12px; padding-bottom: 6px; display: flex; align-items: center; gap: 16px;">
          <h1 class="d47-title" style="margin: 0; flex: none; line-height: 1; color: var(--d47-white);">Commander</h1>
          <p style="margin: 0; padding-top: 3px; flex: 1 1 auto; min-width: 0; font-size: 15px; color: var(--d47-grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">No missions accepted.</p>
          <label class="d47-search" style="width: 300px; height: 44px; flex: none;">
            <input type="search" aria-label="Search this page" placeholder="Search this page">
          </label>
        </div>
      </div>
      <img src="avatar.jpg" alt="D47" style="width: 104px; height: 104px; display: block; object-fit: contain;">
    </div>
    <div style="margin-top: -18px; display: flex; flex-direction: column;">
      <div style="height: 1px; background: var(--d47-a);"></div>
      <nav aria-label="Sections" class="d47-subtabs" style="flex-wrap: wrap; padding-top: 8px;">
        <button type="button" class="d47-subtab">Checklist</button>
        <button type="button" class="d47-subtab active" aria-current="page">Missions</button>
        <button type="button" class="d47-subtab">Standing</button>
        <button type="button" class="d47-subtab">Statistics</button>
        <button type="button" class="d47-subtab">This session</button>
      </nav>
    </div>


    <div style="max-width: 640px; display: flex; flex-direction: column; gap: 10px; padding-top: 24px;">
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: var(--d47-white);">There are no missions on your board, Commander.</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--d47-grey);">Missions on offer at a station are not in the journal. Accept one and it appears here.</p>
      <div class="d47-hint" style="padding-top: 6px;">Say: “read the mission board”</div>
    </div>
  </div>
  <div class="d47-scanlines" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["elite","dark","light","elite-palette"],"default":"elite"},"$preview":{"width":1280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (new URLSearchParams(location.search).get('theme') || this.props.theme || 'elite') };
  }
}
</script>
</body>
</html>
