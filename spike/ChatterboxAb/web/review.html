<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Review</title>
<style>
  :root { --bg: #14181d; --panel: #1d232a; --ink: #e8edf2; --muted: #93a0ae; --rule: #2f3944; --yes: #3fbf7f; --no: #e0665a; --wait: #e0a21a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--rule); padding: 14px 24px; display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 1.2rem; margin: 0; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); }
  .count b { color: var(--yes); font-size: 1.3rem; }
  label { color: var(--muted); }
  main { padding: 16px 24px 80px; display: grid; gap: 10px; max-width: 1100px; }
  .row { display: grid; grid-template-columns: 1fr 320px auto auto; gap: 14px; align-items: center; background: var(--panel); padding: 10px 14px; border-radius: 6px; border-left: 4px solid var(--rule); }
  .row.yes { border-left-color: var(--yes); }
  .row.no { border-left-color: var(--no); opacity: 0.55; }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  audio { width: 320px; height: 36px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
  button.yes:hover, button.yes.on { background: var(--yes); border-color: var(--yes); color: #08130d; }
  button.no:hover, button.no.on { background: var(--no); border-color: var(--no); color: #1a0a08; }
  .hint { color: var(--muted); }
  kbd { background: var(--rule); padding: 1px 6px; border-radius: 4px; font-size: 0.85em; }
</style>
</head>
<body>
<header>
  <h1>Voice Review</h1>
  <div class="count"><b id="approved">0</b> approved of 100 wanted · <span id="left">0</span> to review</div>
  <label><input type="checkbox" id="hide" checked> hide reviewed</label>
  <span class="hint"><kbd>space</kbd> play · <kbd>Y</kbd> interesting · <kbd>N</kbd> meh · <kbd>↓</kbd> next</span>
</header>
<main id="list"></main>
<script>
  const list = document.getElementById('list');
  let rows = [];
  let current = 0;

  async function load() {
    const data = await (await fetch('/api/candidates')).json();
    rows = data;
    render();
  }

  function render() {
    const hide = document.getElementById('hide').checked;
    list.innerHTML = '';
    let approved = 0, left = 0;
    rows.forEach((c, i) => {
      if (c.verdict === 'yes') approved++;
      if (!c.verdict) left++;
      if (hide && c.verdict) return;
      const row = document.createElement('div');
      row.className = 'row ' + (c.verdict || '');
      row.dataset.index = i;
      row.innerHTML = `
        <div><div class="name">${c.voice}</div><div class="meta">${c.category} · ${c.seconds}s · ${c.licence}</div></div>
        <audio preload="none" controls src="/corpus/${c.file}"></audio>
        <button class="yes ${c.verdict === 'yes' ? 'on' : ''}">interesting</button>
        <button class="no ${c.verdict === 'no' ? 'on' : ''}">meh</button>`;
      row.querySelector('.yes').onclick = () => verdict(i, 'yes');
      row.querySelector('.no').onclick = () => verdict(i, 'no');
      row.querySelector('audio').onplay = () => { current = i; };
      list.appendChild(row);
    });
    document.getElementById('approved').textContent = approved;
    document.getElementById('left').textContent = left;
  }

  async function verdict(i, v) {
    rows[i].verdict = v;
    await fetch('/api/verdict', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: rows[i].id, verdict: v }) });
    render();
    const next = document.querySelector('.row');
    if (next) { const a = next.querySelector('audio'); a.scrollIntoView({ block: 'center' }); a.play(); current = +next.dataset.index; }
  }

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const row = document.querySelector(`.row[data-index="${current}"]`) || document.querySelector('.row');
    if (!row) return;
    const audio = row.querySelector('audio');
    if (e.code === 'Space') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); current = +row.dataset.index; }
    if (e.key === 'y' || e.key === 'Y') verdict(+row.dataset.index, 'yes');
    if (e.key === 'n' || e.key === 'N') verdict(+row.dataset.index, 'no');
    if (e.key === 'ArrowDown') { const n = row.nextElementSibling; if (n) { current = +n.dataset.index; n.querySelector('audio').scrollIntoView({ block: 'center' }); n.querySelector('audio').play(); e.preventDefault(); } }
  });

  document.getElementById('hide').onchange = render;
  load();
</script>
</body>
</html>
